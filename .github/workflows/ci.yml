name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aied-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aied-backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f"; done
